name: Daily Nifty 500 Screener

on:
  schedule:
    # 4:00 PM IST = 10:30 AM UTC  (IST = UTC + 5:30)
    # Runs Monday–Friday after NSE market close
    - cron: '30 10 * * 1-5'

  # Lets you trigger a manual run from the GitHub Actions UI anytime
  workflow_dispatch:

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 150        # full Nifty 500 scan can take ~90 mins

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run screener
        env:
          WHATSAPP_PHONE:    ${{ secrets.WHATSAPP_PHONE }}
          CALLMEBOT_API_KEY: ${{ secrets.CALLMEBOT_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python screener.py
