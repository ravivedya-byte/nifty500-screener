name: NSE Investment Screener

on:
  schedule:
    # Weekday screener: 5:30 PM IST = 12:00 PM UTC  Mon-Fri
    - cron: '0 12 * * 1-5'
    # Saturday weekly report: 10:00 AM IST = 4:30 AM UTC
    - cron: '30 4 * * 6'

  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode: screener or weekly_report'
        required: false
        default: 'screener'

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Determine run mode
        run: |
          DAY=$(date +%u)
          if [ "$DAY" = "6" ]; then
            echo "SCREENER_MODE=weekly_report" >> $GITHUB_ENV
          else
            echo "SCREENER_MODE=screener" >> $GITHUB_ENV
          fi
          if [ "${{ github.event.inputs.mode }}" != "" ]; then
            echo "SCREENER_MODE=${{ github.event.inputs.mode }}" >> $GITHUB_ENV
          fi

      - name: Run
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
          SEBI_RA_NUMBER:     ${{ secrets.SEBI_RA_NUMBER }}
          SUBSTACK_BASE_URL:  ${{ secrets.SUBSTACK_BASE_URL }}
          SCREENER_MODE:      ${{ env.SCREENER_MODE }}
        run: python screener.py

      - name: Commit updated data files
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          for f in alerts_log.json watchlist_log.json near_miss_log.csv performance_log.json ai_queue.json ai_assessments_log.json; do
            [ -f "$f" ] && git add "$f" || true
          done
          git diff --staged --quiet || git commit -m "Data: $(date +%Y-%m-%d) [${SCREENER_MODE}]"
          git push
